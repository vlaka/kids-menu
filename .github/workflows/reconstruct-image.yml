name: Reconstruct uploaded image

on:
  push:
    paths:
      - '.upload/READY'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct binary image
        shell: bash
        run: |
          set -euo pipefail
          target="$(cat .upload/target.txt)"
          mkdir -p "$(dirname "$target")"
          cat .upload/chunk-* | base64 -d > "$target"
          size=$(wc -c < "$target")
          echo "Reconstructed $target ($size bytes)"
          test "$size" -gt 10000
          rm -rf .upload
      - name: Commit reconstructed image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruct full-quality dish image"
          git push
