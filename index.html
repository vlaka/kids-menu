<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff7ed" />
  <meta name="description" content="Личный ресторан Арианы и Алисы" />
  <link rel="manifest" href="manifest.webmanifest?v=15" />
  <link rel="stylesheet" href="styles.css?v=15" />
  <title>Личный ресторан Арианы и Алисы</title>
</head>
<body>
  <header class="app-header">
    <button id="homeButton" class="icon-button" type="button" aria-label="На главную">🏠</button>
    <div class="header-title">
      <p class="eyebrow">Наш ресторан</p>
      <h1>Личный ресторан Арианы и Алисы</h1>
    </div>
    <button id="settingsButton" class="icon-button" type="button" aria-label="Настройки" aria-haspopup="dialog">⚙️</button>
  </header>

  <main class="page">
    <section id="status" class="status" aria-live="polite"></section>
    <section id="homeView" class="home-view" aria-label="Категории меню">
      <div class="home-heading">
        <h2>Категории</h2>
      </div>
      <div id="categoryCards" class="category-card-grid"></div>
    </section>
    <section id="menu" class="menu-sections" aria-label="Меню ресторана" hidden></section>
  </main>

  <nav id="categoryNav" class="bottom-nav" aria-label="Категории меню"></nav>

  <dialog id="settingsDialog" class="settings-dialog">
    <div class="settings-header">
      <h2>Настройки</h2>
      <button id="closeSettingsButton" class="icon-button small" type="button" aria-label="Закрыть">✕</button>
    </div>
    <div class="settings-body">
      <button id="refreshButton" class="settings-action" type="button">↻ Обновить меню</button>
      <p id="lastUpdated" class="settings-note">Последнее обновление: неизвестно</p>
    </div>
  </dialog>

  <template id="categoryTemplate">
    <section class="category-section">
      <div class="section-heading">
        <span class="category-icon"></span>
        <h2 class="category-title"></h2>
      </div>
      <div class="dish-grid"></div>
    </section>
  </template>

  <template id="dishTemplate">
    <article class="dish-card">
      <div class="dish-photo-wrap">
        <img class="dish-photo" alt="" loading="lazy" hidden />
        <div class="dish-placeholder" aria-hidden="true">🍽️</div>
      </div>
      <div class="dish-content">
        <h3 class="dish-name"></h3>
        <p class="dish-description"></p>
      </div>
    </article>
  </template>

  <script src="app.js?v=15" defer></script>
</body>
</html>
